{% extends "users/base_generic.html" %}

{% block title %}Password Reset Complete | BookMySeat{% endblock %}

{% block content %}
<style>
    .reset-success-page {
        min-height: 75vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 50px 20px;
    }

    .reset-success-card {
        width: 100%;
        max-width: 520px;
        background: #15151b;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 45px 35px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        animation: fadeUp 0.6s ease;
    }

    .success-icon {
        width: 85px;
        height: 85px;
        margin: 0 auto 25px;
        border-radius: 50%;
        background: rgba(40, 167, 69, 0.12);
        border: 1px solid rgba(40, 167, 69, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #28a745;
        font-size: 38px;
    }

    .reset-success-card h2 {
        color: #ffffff;
        font-weight: 700;
        font-size: 30px;
        margin-bottom: 15px;
    }

    .reset-success-card p {
        color: #a9a9b2;
        font-size: 16px;
        line-height: 1.7;
        margin-bottom: 30px;
    }

    .login-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-width: 190px;
        padding: 13px 25px;
        border-radius: 10px;
        background: #e50914;
        color: #ffffff !important;
        text-decoration: none;
        font-weight: 600;
        transition: all 0.3s ease;
        box-shadow: 0 8px 25px rgba(229, 9, 20, 0.25);
    }

    .login-btn:hover {
        background: #ff1a25;
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(229, 9, 20, 0.35);
        text-decoration: none;
    }

    @keyframes fadeUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 576px) {
        .reset-success-page {
            padding: 30px 15px;
        }

        .reset-success-card {
            padding: 35px 22px;
        }

        .reset-success-card h2 {
            font-size: 25px;
        }

        .reset-success-card p {
            font-size: 15px;
        }

        .success-icon {
            width: 72px;
            height: 72px;
            font-size: 32px;
        }

        .login-btn {
            width: 100%;
        }
    }
</style>

<div class="reset-success-page">
    <div class="reset-success-card">

        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>

        <h2>Password Reset Complete</h2>

        <p>
            Your password has been successfully reset.
            You can now log in securely using your new password.
        </p>

        <a href="{% url 'login' %}" class="login-btn">
            <i class="fas fa-sign-in-alt"></i>
            Log In Now
        </a>

    </div>
</div>
{% endblock %}
```
