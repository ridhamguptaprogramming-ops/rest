
{% extends "users/basic.html" %}

{% block title %}Logged Out | BookMySeat{% endblock %}

{% block content %}

<style>
    .logout-page {
        min-height: 65vh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 50px 20px;
    }

    .logout-card {
        width: 100%;
        max-width: 500px;

        background: #19191f;

        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 20px;

        padding: 45px 35px;

        text-align: center;

        box-shadow: 0 20px 50px rgba(0,0,0,0.35);

        animation: fadeIn 0.5s ease;
    }

    .logout-icon {
        width: 80px;
        height: 80px;

        margin: 0 auto 25px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;

        background: rgba(229,9,20,0.12);
        border: 1px solid rgba(229,9,20,0.3);

        color: #e50914;

        font-size: 32px;
    }

    .logout-card h1 {
        color: #fff;

        font-size: 1.8rem;
        font-weight: 700;

        margin-bottom: 12px;
    }

    .logout-card p {
        color: #999;

        font-size: 14px;
        line-height: 1.7;

        margin-bottom: 28px;
    }

    .login-button {
        display: inline-flex;

        align-items: center;
        justify-content: center;

        gap: 8px;

        padding: 12px 25px;

        background: #e50914;
        border: 1px solid #e50914;

        color: #fff !important;

        border-radius: 10px;

        text-decoration: none;

        font-size: 14px;
        font-weight: 600;

        transition: all 0.25s ease;
    }

    .login-button:hover {
        background: #b20710;
        border-color: #b20710;

        transform: translateY(-2px);

        box-shadow: 0 8px 20px rgba(229,9,20,0.25);
    }

    .logout-footer-text {
        margin-top: 22px;

        color: #666;

        font-size: 12px;
    }

    @keyframes fadeIn {

        from {
            opacity: 0;
            transform: translateY(15px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }

    }

    @media (max-width: 576px) {

        .logout-card {
            padding: 35px 22px;
        }

        .logout-card h1 {
            font-size: 1.5rem;
        }

        .logout-icon {
            width: 70px;
            height: 70px;
            font-size: 27px;
        }

        .login-button {
            width: 100%;
        }
    }
</style>


<div class="logout-page">

    <div class="logout-card">

        <!-- Logout Icon -->

        <div class="logout-icon">
            <i class="fas fa-sign-out-alt"></i>
        </div>


        <!-- Message -->

        <h1>
            You have been logged out
        </h1>

        <p>
            Your BookMySeat session has ended successfully.
            Thank you for visiting us. We hope to see you again soon!
        </p>


        <!-- Login -->

        <a
            href="{% url 'login' %}"
            class="login-button"
        >
            <i class="fas fa-sign-in-alt"></i>
            Login Again
        </a>


        <div class="logout-footer-text">
            Ready to book your next movie?
        </div>

    </div>

</div>


<!-- Font Awesome -->

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
>

{% endblock %}
