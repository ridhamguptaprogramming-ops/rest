```django
{% extends "users/basic.html" %}

{% block title %}Set New Password | BookMySeat{% endblock %}

{% block content %}
<style>
    .password-reset-page {
        min-height: 75vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 50px 20px;
    }

    .password-reset-card {
        width: 100%;
        max-width: 500px;
        background: #15151b;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 40px 35px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        animation: fadeUp 0.6s ease;
    }

    .password-icon {
        width: 75px;
        height: 75px;
        margin: 0 auto 22px;
        border-radius: 50%;
        background: rgba(229, 9, 20, 0.12);
        border: 1px solid rgba(229, 9, 20, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e50914;
        font-size: 30px;
    }

    .password-reset-card h2 {
        color: #ffffff;
        text-align: center;
        font-weight: 700;
        font-size: 28px;
        margin-bottom: 10px;
    }

    .subtitle {
        color: #9999a3;
        text-align: center;
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 30px;
    }

    /* Django form styling */
    .password-reset-card form p {
        margin-bottom: 20px;
    }

    .password-reset-card label {
        display: block;
        color: #e6e6eb;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .password-reset-card input {
        width: 100%;
        padding: 12px 14px;
        background: #0d0d12;
        color: #ffffff;
        border: 1px solid #303039;
        border-radius: 9px;
        outline: none;
        transition: all 0.25s ease;
    }

    .password-reset-card input:focus {
        border-color: #e50914;
        box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.12);
    }

    .password-reset-card input::placeholder {
        color: #666670;
    }

    .password-reset-card ul {
        color: #9999a3;
        font-size: 13px;
        line-height: 1.6;
        padding-left: 20px;
        margin-top: 8px;
    }

    .password-reset-card .errorlist {
        color: #ff5a63;
        font-size: 13px;
        margin: 6px 0 8px;
        padding-left: 18px;
    }

    .password-reset-card .helptext {
        display: block;
        color: #777780;
        font-size: 12px;
        margin-top: 7px;
        line-height: 1.5;
    }

    .submit-btn {
        width: 100%;
        border: none;
        padding: 13px 20px;
        border-radius: 10px;
        background: #e50914;
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 8px 25px rgba(229, 9, 20, 0.22);
    }

    .submit-btn:hover {
        background: #ff1a25;
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(229, 9, 20, 0.35);
    }

    .security-note {
        margin-top: 22px;
        padding: 12px 14px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.035);
        color: #858590;
        font-size: 12px;
        text-align: center;
    }

    .security-note i {
        color: #28a745;
        margin-right: 5px;
    }

    @keyframes fadeUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 576px) {
        .password-reset-page {
            padding: 30px 15px;
        }

        .password-reset-card {
            padding: 32px 22px;
        }

        .password-reset-card h2 {
            font-size: 24px;
        }

        .password-icon {
            width: 68px;
            height: 68px;
            font-size: 27px;
        }
    }
</style>

<div class="password-reset-page">
    <div class="password-reset-card">

        <div class="password-icon">
            <i class="fas fa-lock"></i>
        </div>

        <h2>Set New Password</h2>

        <p class="subtitle">
            Create a strong new password for your BookMySeat account.
        </p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button class="submit-btn" type="submit">
                <i class="fas fa-check-circle me-2"></i>
                Set New Password
            </button>
        </form>

        <div class="security-note">
            <i class="fas fa-shield-alt"></i>
            Your password is securely protected.
        </div>

    </div>
</div>
{% endblock %}
```
